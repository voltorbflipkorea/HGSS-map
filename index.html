<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HG/SS 지도 v0.8</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4ecd8;--paper-shade:#e8dcc0;--ink:#3a2e1e;--ink-soft:#5e4d36;--gold:#c9a96e;--gold-dark:#9c7f48;--red:#c0392b;--shadow:rgba(58,46,30,.25);--glow:rgba(225,255,240,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Gowun Dodum',serif;background:var(--ink);color:var(--ink)}
  #app{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{background:var(--ink);color:var(--paper);padding:10px 18px;border-bottom:3px double var(--gold);display:flex;align-items:center;gap:16px;z-index:10;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,var(--red) 0 50%,var(--paper) 50% 100%);border:3px solid var(--ink);position:relative;box-shadow:inset 0 0 0 2px var(--paper),0 0 0 1px var(--gold)}
  .logo-mark::after{content:'';position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
  h1{font-family:'DotGothic16',sans-serif;font-size:18px;letter-spacing:1px;color:var(--gold);text-shadow:1px 1px 0 #000}
  h1 .ver{color:var(--paper);font-size:12px;margin-left:6px;opacity:.7}
  .search-area{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search-box{position:relative}
  .search-box input{font-family:'Gowun Dodum',serif;background:var(--paper);color:var(--ink);border:2px solid var(--gold);border-radius:18px;padding:7px 14px 7px 32px;font-size:13px;width:200px;outline:none}
  .search-box input:focus{box-shadow:0 0 0 3px rgba(201,169,110,.3);background:#fff}
  .search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
  main{position:relative;overflow:hidden;background:#1a1410}
  #map-stage{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab}
  #map-stage.dragging{cursor:grabbing}
  #map-svg{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  /* 지명 라벨 */
  .lbl{font-family:'DotGothic16',sans-serif;font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:4;stroke-linejoin:round}
  .lead-line{stroke:var(--ink);stroke-width:1.6;fill:none;opacity:.7}
  .lead-dot{fill:var(--ink);stroke:var(--paper);stroke-width:1.5}
  /* 클릭 핫스팟 */
  .hotspot{fill:transparent;cursor:pointer}
  .hotspot:hover{fill:rgba(255,255,255,.18)}
  /* 포켓몬 팝업 패널 */
  #panel{position:absolute;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--paper);border-left:3px solid var(--ink);box-shadow:-4px 0 20px var(--shadow);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:20;display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .panel-head{background:var(--ink);color:var(--paper);padding:14px 18px;border-bottom:3px double var(--gold);position:relative}
  .panel-head h2{font-family:'DotGothic16',sans-serif;font-size:18px;color:var(--gold);text-shadow:1px 1px 0 #000;margin-bottom:3px}
  .panel-head .rg{display:inline-block;margin-top:6px;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:10px;font-family:'DotGothic16',sans-serif;font-size:10px;letter-spacing:1px}
  .panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;background:transparent;border:2px solid var(--gold);color:var(--gold);border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
  .panel-close:hover{background:var(--gold);color:var(--ink)}
  .panel-body{flex:1;overflow-y:auto;padding:16px 18px}
  .panel-body h3{font-family:'DotGothic16',sans-serif;font-size:12px;color:#2d5016;border-bottom:2px solid var(--gold);padding-bottom:3px;margin-bottom:10px}
  .poke-empty{text-align:center;padding:30px 14px;color:var(--ink-soft)}
  .poke-empty .big{font-family:'DotGothic16',sans-serif;font-size:14px;margin-bottom:6px}
  /* 검색 시 영역 전체 깜빡임 */
  .hl-box{fill:var(--glow);stroke:#fff;stroke-width:3;opacity:0;transform-origin:center;transform-box:fill-box;animation:hlBox 1.7s ease-in-out infinite}
  @keyframes hlBox{0%,100%{opacity:0;transform:scale(.96)}50%{opacity:.5;transform:scale(1.04)}}
  .hl-glow{fill:none;stroke:var(--glow);stroke-width:6;opacity:0;transform-origin:center;transform-box:fill-box;animation:hlGlow 1.7s ease-out infinite;filter:drop-shadow(0 0 8px var(--glow))}
  @keyframes hlGlow{0%{opacity:0;transform:scale(.9)}30%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
  .status{position:absolute;bottom:18px;left:18px;background:var(--ink);color:var(--paper);padding:6px 12px;border:2px solid var(--gold);border-radius:6px;font-family:'DotGothic16',sans-serif;font-size:11px;letter-spacing:1px;z-index:10;box-shadow:2px 2px 0 var(--gold-dark)}
  .zoom-controls{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:10}
  .zoom-btn{width:42px;height:42px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:'DotGothic16',sans-serif;font-size:16px;cursor:pointer;border-radius:8px;box-shadow:2px 2px 0 var(--ink)}
  .zoom-btn:hover{background:var(--gold)}
  .zoom-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .search-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(58,46,30,.94);color:var(--paper);padding:8px 14px 8px 16px;border:2px solid var(--gold);border-radius:18px;font-size:12px;z-index:6;display:none;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .search-banner.active{display:flex;animation:slide .3s ease-out}
  .search-banner strong{color:var(--gold);font-family:'DotGothic16',sans-serif;margin:0 2px}
  .banner-clear{background:transparent;border:1.5px solid var(--gold);color:var(--gold);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;padding:0;display:flex;align-items:center;justify-content:center}
  .banner-clear:hover{background:var(--gold);color:var(--ink)}
  @keyframes slide{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .search-results{position:absolute;top:100%;left:0;margin-top:4px;background:var(--paper);border:2px solid var(--gold);border-radius:10px;max-height:340px;overflow-y:auto;width:240px;z-index:50;box-shadow:0 4px 16px var(--shadow);display:none}
  .search-results.active{display:block}
  .search-results .item{padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--paper-shade);font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
  .search-results .item:last-child{border-bottom:none}
  .search-results .item:hover{background:var(--paper-shade)}
  .search-results .item .meta{font-size:11px;color:var(--ink-soft);font-family:'DotGothic16',sans-serif}
  .search-results .empty{padding:16px;text-align:center;color:var(--ink-soft);font-size:12px}
  @media(max-width:700px){header{padding:8px 10px;gap:8px}h1{font-size:15px}.search-box input{width:150px;font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><div class="logo-mark"></div><h1>HG/SS 지도<span class="ver">v.0.8</span></h1></div>
    <div class="search-area">
      <div class="search-box">
        <input id="loc-search" placeholder="장소 검색..." autocomplete="off">
        <div id="loc-results" class="search-results"></div>
      </div>
    </div>
  </header>
  <main>
    <div id="map-stage">
      <div class="search-banner" id="banner"><span>📍 <strong id="banner-name"></strong></span><button class="banner-clear" id="banner-clear" title="해제 (Esc)">✕</button></div>
      <div class="status" id="status">SCALE: 100%</div>
      <div class="zoom-controls"><button class="zoom-btn" id="zin">+</button><button class="zoom-btn" id="zout">−</button><button class="zoom-btn" id="zreset" title="전체보기">⊙</button></div>
      <svg id="map-svg" viewBox="0 0 2157 857" preserveAspectRatio="xMidYMid meet">
        <image id="bg" x="0" y="0" width="2157" height="857" href=""/>
        <g id="hl-layer"></g>
        <g id="lbl-layer"></g>
        <g id="hot-layer"></g>
      </svg>
    </div>
  </main>
  <aside id="panel">
    <div class="panel-head">
      <button class="panel-close" id="panel-close">✕</button>
      <h2 id="panel-name">장소</h2>
      <span class="rg" id="panel-rg">성도</span>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

6,105]]},"palpark":{"ko":"팔파크","r":"관동","b":[[1727,624,46,46]]},"vermilion":{"ko":"갈색시티","r":"관동","b":[[1865,474,105,106]]},"celadon":{"ko":"무지개시티","r":"관동","b":[[1721,379,106,104]]},"diglett":{"ko":"디그다의 굴","r":"관동","b":[[1966,480,46,46],[1487,241,46,46]]},"saffron":{"ko":"노랑시티","r":"관동","b":[[1865,331,105,104]]},"lavender":{"ko":"보라타운","r":"관동","b":[[2056,379,58,56]]},"power":{"ko":"발전소","r":"관동","b":[[2062,289,46,46]]},"rocktunnel":{"ko":"돌산터널","r":"관동","b":[[2062,241,46,46]]},"cerulean":{"ko":"블루시티","r":"관동","b":[[1865,187,105,106]]},"cerulean-cave":{"ko":"블루시티동굴","r":"관동","b":[[1871,193,46,46]]},"moon":{"ko":"달맞이산","r":"관동","b":[[1679,193,46,46]]},"pewter":{"ko":"회색시티","r":"관동","b":[[1481,139,106,106]]},"viridian-forest":{"ko":"상록숲","r":"관동","b":[[1487,289,46,46]]}};

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map-svg'),stage=document.getElementById('map-stage'),statusEl=document.getElementById('status');
const hlLayer=document.getElementById('hl-layer'),lblLayer=document.getElementById('lbl-layer'),hotLayer=document.getElementById('hot-layer');
const banner=document.getElementById('banner'),bannerName=document.getElementById('banner-name');

// ===== 지명 라벨 + 클릭 핫스팟 =====
function renderLabels(){
  lblLayer.innerHTML='';hotLayer.innerHTML='';
  Object.entries(LOC).forEach(([id,l])=>{
    l.b.forEach(bx=>{
      const[x,y,w,h]=bx,cx=x+w/2,cy=y+h/2;
      // 클릭 핫스팟 (위치 영역)
      const hs=document.createElementNS(NS,'rect');
      hs.setAttribute('x',x);hs.setAttribute('y',y);hs.setAttribute('width',w);hs.setAttribute('height',h);
      hs.setAttribute('rx',Math.min(w,h)*0.25);hs.setAttribute('class','hotspot');hs.dataset.id=id;
      hs.addEventListener('click',e=>{e.stopPropagation();selectLoc(id);openPanel(id);});
      hotLayer.appendChild(hs);
      // 라벨
      if(l.lead){
        // 외부 라벨 + 화살표: 점은 영역 중심, 글자는 외부
        const[tx,ty]=l.lead;
        const ln=document.createElementNS(NS,'line');
        ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);ln.setAttribute('x2',tx);ln.setAttribute('y2',ty);
        ln.setAttribute('class','lead-line');lblLayer.appendChild(ln);
        const dot=document.createElementNS(NS,'circle');
        dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r','3.5');dot.setAttribute('class','lead-dot');lblLayer.appendChild(dot);
        const t=document.createElementNS(NS,'text');
        t.setAttribute('x',tx);t.setAttribute('y',ty+4);t.setAttribute('class','lbl');
        if(l.fs)t.setAttribute('font-size',l.fs);t.textContent=l.ko;lblLayer.appendChild(t);
      }else{
        const t=document.createElementNS(NS,'text');
        t.setAttribute('x',cx);t.setAttribute('y',cy+4+(l.ldy||0));t.setAttribute('class','lbl');
        if(l.fs)t.setAttribute('font-size',l.fs);t.textContent=l.ko;lblLayer.appendChild(t);
      }
    });
  });
}

// ===== 줌/팬 =====
const view={x:0,y:0,w:2157,h:857,baseW:2157,baseH:857};
function clamp(){
  view.w=Math.min(view.w,view.baseW);view.h=Math.min(view.h,view.baseH);
  view.x=Math.max(0,Math.min(view.x,view.baseW-view.w));
  view.y=Math.max(0,Math.min(view.y,view.baseH-view.h));
}
function apply(){clamp();svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);statusEl.textContent='SCALE: '+Math.round(view.baseW/view.w*100)+'%';}
function zoomTo(x,y,w,h,anim=true){
  if(anim){const s={...view},t={x,y,w,h},dur=600,st=performance.now();
    (function tick(now){const k=Math.min((now-st)/dur,1),e=1-Math.pow(1-k,3);
      view.x=s.x+(t.x-s.x)*e;view.y=s.y+(t.y-s.y)*e;view.w=s.w+(t.w-s.w)*e;view.h=s.h+(t.h-s.h)*e;apply();
      if(k<1)requestAnimationFrame(tick);})(st);
  }else{view.x=x;view.y=y;view.w=w;view.h=h;apply();}
}
function zoomBy(f,cx,cy){const nw=view.w/f,nh=view.h/f;if(nw<200||nw>view.baseW)return;
  if(cx===undefined){cx=view.x+view.w/2;cy=view.y+view.h/2;}
  view.x=cx-(cx-view.x)/f;view.y=cy-(cy-view.y)/f;view.w=nw;view.h=nh;apply();}
document.getElementById('zin').onclick=()=>zoomBy(1.4);
document.getElementById('zout').onclick=()=>zoomBy(1/1.4);
document.getElementById('zreset').onclick=()=>{zoomTo(0,0,view.baseW,view.baseH);clearHL();};
function c2s(cx,cy){const r=svg.getBoundingClientRect();return{x:view.x+(cx-r.left)/r.width*view.w,y:view.y+(cy-r.top)/r.height*view.h};}
stage.addEventListener('wheel',e=>{e.preventDefault();const p=c2s(e.clientX,e.clientY);zoomBy(e.deltaY<0?1.2:1/1.2,p.x,p.y);},{passive:false});
let drag=false,ds=null;
stage.addEventListener('mousedown',e=>{drag=true;stage.classList.add('dragging');ds={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};});
window.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
  view.x=ds.vx-(e.clientX-ds.x)*(view.w/r.width);view.y=ds.vy-(e.clientY-ds.y)*(view.h/r.height);apply();});
window.addEventListener('mouseup',()=>{drag=false;stage.classList.remove('dragging');});
let td=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length===1)td={m:'pan',x:e.touches[0].clientX,y:e.touches[0].clientY,vx:view.x,vy:view.y};
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;td={m:'pinch',d:Math.hypot(dx,dy),w:view.w,h:view.h};}
},{passive:true});
stage.addEventListener('touchmove',e=>{if(!td)return;e.preventDefault();
  if(td.m==='pan'&&e.touches.length===1){const r=svg.getBoundingClientRect();
    view.x=td.vx-(e.touches[0].clientX-td.x)*(view.w/r.width);view.y=td.vy-(e.touches[0].clientY-td.y)*(view.h/r.height);apply();}
  else if(td.m==='pinch'&&e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,f=Math.hypot(dx,dy)/td.d,nw=td.w/f,nh=td.h/f;
    if(nw>200&&nw<view.baseW){const cx=view.x+view.w/2,cy=view.y+view.h/2;view.w=nw;view.h=nh;view.x=cx-nw/2;view.y=cy-nh/2;apply();}}
},{passive:false});
stage.addEventListener('touchend',()=>{td=null;});

// ===== 영역 깜빡임 =====
function clearHL(){hlLayer.innerHTML='';banner.classList.remove('active');}
function selectLoc(id){
  const loc=LOC[id];if(!loc)return;
  clearHL();
  loc.b.forEach((bx,i)=>{
    const[x,y,w,h]=bx;const rx=Math.min(w,h)*0.4;const d=(i*0.18).toFixed(2)+'s';
    // 채워지는 영역
    const r1=document.createElementNS(NS,'rect');
    r1.setAttribute('x',x);r1.setAttribute('y',y);r1.setAttribute('width',w);r1.setAttribute('height',h);
    r1.setAttribute('rx',rx);r1.setAttribute('class','hl-box');r1.style.animationDelay=d;
    // 퍼지는 외곽선
    const r2=document.createElementNS(NS,'rect');
    r2.setAttribute('x',x);r2.setAttribute('y',y);r2.setAttribute('width',w);r2.setAttribute('height',h);
    r2.setAttribute('rx',rx);r2.setAttribute('class','hl-glow');r2.style.animationDelay=d;
    hlLayer.appendChild(r1);hlLayer.appendChild(r2);
  });
  // 모든 박스가 들어오게 줌
  const xs=loc.b.map(b=>b[0]),ys=loc.b.map(b=>b[1]),xe=loc.b.map(b=>b[0]+b[2]),ye=loc.b.map(b=>b[1]+b[3]);
  const minX=Math.min(...xs),maxX=Math.max(...xe),minY=Math.min(...ys),maxY=Math.max(...ye);
  const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
  const ZW=Math.max(520,(maxX-minX)+320),ZH=Math.max(320,(maxY-minY)+220);
  zoomTo(cx-ZW/2,cy-ZH/2,ZW,ZH);
  bannerName.textContent=loc.ko;banner.classList.add('active');
}
document.getElementById('banner-clear').onclick=clearHL;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearHL();closePanel();locResults.classList.remove('active');}});

// ===== 포켓몬 팝업 패널 =====
const panel=document.getElementById('panel'),panelName=document.getElementById('panel-name'),panelRg=document.getElementById('panel-rg'),panelBody=document.getElementById('panel-body');
function openPanel(id){
  const l=LOC[id];if(!l)return;
  panelName.textContent=l.ko;panelRg.textContent=l.r;
  // 포켓몬 데이터는 아직 없음 → 빈 상태
  panelBody.innerHTML='<h3>☀️ 출현 포켓몬</h3><div class="poke-empty"><div class="big">데이터 준비 중</div><div style="font-size:11px">이 장소의 야생 포켓몬 정보는 아직 등록되지 않았습니다.</div></div>';
  panel.classList.add('open');
}
function closePanel(){panel.classList.remove('open');}
document.getElementById('panel-close').onclick=closePanel;

// ===== 검색 =====
const locSearch=document.getElementById('loc-search'),locResults=document.getElementById('loc-results');
function search(q){
  q=q.trim().toLowerCase();
  if(!q){locResults.classList.remove('active');return;}
  const m=Object.entries(LOC).filter(([id,l])=>l.ko.toLowerCase().includes(q)).slice(0,25);
  locResults.innerHTML=m.length?m.map(([id,l])=>
    `<div class="item" data-id="${id}"><div>${l.ko}</div><div class="meta">${l.r}</div></div>`).join('')
    :'<div class="empty">검색 결과 없음</div>';
  locResults.querySelectorAll('.item').forEach(it=>it.onclick=()=>{selectLoc(it.dataset.id);openPanel(it.dataset.id);locResults.classList.remove('active');locSearch.value='';});
  locResults.classList.add('active');
}
locSearch.addEventListener('input',e=>search(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('#loc-search')&&!e.target.closest('#loc-results'))locResults.classList.remove('active');});

renderLabels();
apply();
</script>
